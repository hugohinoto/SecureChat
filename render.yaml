services:
  - type: web
    name: securechat
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      # Reuse an existing Render Postgres database.
      # Render will prompt for this value during Blueprint setup.
      - key: DATABASE_URL
        sync: false
