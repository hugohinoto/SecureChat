services:
  - type: web
    name: securechat
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: DATABASE_URL
        fromDatabase:
          name: securechat-db
          property: connectionString

databases:
  - name: securechat-db
    databaseName: securechat
    user: securechat_app
    postgresMajorVersion: "18"
    region: singapore
    plan: free
    ipAllowList: []
