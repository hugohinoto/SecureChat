<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>バグ報告 | SecureChat</title><link rel="stylesheet" href="/tools.css"><script src="/report-bug.js" defer></script></head>
<body><main class="tool-shell"><header class="tool-header"><a href="/">← SecureChatに戻る</a><span>SUPPORT CENTER</span></header>
<section class="tool-card"><p class="eyebrow">BUG REPORT</p><h1>バグ・不具合を報告</h1><p class="muted">不具合の内容をできるだけ具体的に記入してください。パスワード、招待コード、メッセージ本文などの秘密情報は入力しないでください。</p>
<form id="report-form"><label>問題の種類<select id="category" required><option value="display">画面表示</option><option value="login">ログイン・認証</option><option value="chat">チャット・メッセージ</option><option value="contact">連絡先・招待</option><option value="performance">動作が遅い</option><option value="other">その他</option></select></label>
<label>タイトル<input id="title" maxlength="120" minlength="3" required placeholder="例：メッセージ送信後に画面が更新されない"></label>
<label>詳細<textarea id="description" minlength="10" maxlength="4000" rows="7" required placeholder="発生した操作、表示されたエラー、再現手順など"></textarea></label>
<p class="hint">送信時に現在のページとアプリのバージョンを自動添付します。IPアドレスやパスワードは報告に含めません。</p>
<p id="message" class="message" role="status" aria-live="polite"></p><button class="primary" type="submit">報告を送信</button></form></section>
<section class="tool-card"><h2>自分の報告履歴</h2><div id="report-list" class="report-list">読み込み中…</div></section></main></body></html>
