name: Worker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - run: npm install
      - run: node --check worker/index.js
      - run: node --check worker/admin-features.js
      - run: node --check worker/data-crypto.js
      - run: node --check public/admin.js
      - run: node --check public/bug-report.js
      - run: npm test
      - run: npx wrangler deploy --dry-run
