name: Resolve npm lockfile (one-time)

on:
  push:
    branches:
      - chore/public-readiness-1-4

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/public-readiness-1-4
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Resolve dependencies without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/resolve-lockfile.yml
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:chore/public-readiness-1-4
